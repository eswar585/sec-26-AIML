<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FA Marks Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1565d8,#42a5f5);
}

.login-box{
background:white;
width:380px;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
text-align:center;
color:#1565d8;
margin-bottom:25px;
}

input{
width:100%;
padding:13px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#1565d8;
}

.password-container{
position:relative;
}

.password-container input{
padding-right:45px;
}

.eye{
position:absolute;
right:15px;
top:40%;
transform:translateY(-50%);
cursor:pointer;
font-size:20px;
user-select:none;
}

button{
width:100%;
padding:13px;
background:#1565d8;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0d47a1;
}

#error{
margin-top:12px;
color:red;
text-align:center;
font-size:14px;
}

.contact{
margin-top:25px;
text-align:center;
font-size:13px;
color:#555;
line-height:1.7;
}

.contact a{
display:inline-block;
margin-top:10px;
padding:12px 20px;
background:#EA4335;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
transition:.3s;
}

.contact a:hover{
background:#c5221f;
}

</style>

</head>

<body>

<div class="login-box">

<h2>FA Marks Login</h2>

<input
type="text"
id="regNo"
placeholder="Registration Number">

<div class="password-container">

<input
type="password"
id="password"
placeholder="Password">

<span class="eye" onclick="togglePassword()">👁️</span>

</div>

<button onclick="login()">
Login
</button>

<p id="error"></p>

<div class="contact">

<p>
Forgot your password?<br>
If you need to change your password, contact:
</p>

<a id="contactBtn" href="#">
📧 Contact via Email
</a>

</div>

</div>

<script>

function togglePassword(){

const password=document.getElementById("password");

password.type=password.type==="password"?"text":"password";

}

const email="eswarreddy@gmail.com";

const subject="Password Reset Request";

const body=`Hello Sir/Madam,

My Registration Number:

My Name:

Please reset my password.

Thank you.`;

const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const btn=document.getElementById("contactBtn");

if(mobile){

btn.href=`mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

}else{

btn.href=`https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

btn.target="_blank";

}

</script>

<script src="database.js"></script>
<script src="login.js"></script>

</body>
</html>
