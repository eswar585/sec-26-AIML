<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#1565d8,#42a5f5);

}

.login-box{

background:#fff;

width:380px;

padding:35px;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,.25);

}

h2{

text-align:center;

color:#1565d8;

margin-bottom:25px;

}

input{

width:100%;

padding:13px;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

margin-bottom:15px;

outline:none;

}

input:focus{

border-color:#1565d8;

}

.password-container{

position:relative;

}

.password-container input{

padding-right:45px;

margin-bottom:15px;

}

.eye{

position:absolute;

right:15px;

top:38%;

transform:translateY(-50%);

cursor:pointer;

font-size:18px;

user-select:none;

}

button{

width:100%;

padding:13px;

background:#1565d8;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0d47a1;

}

#error{

margin-top:12px;

text-align:center;

color:red;

font-size:14px;

}

.contact{

margin-top:22px;

text-align:center;

font-size:13px;

color:#555;

line-height:1.5;

}

.contact a{

color:#1565d8;

text-decoration:none;

font-weight:bold;

}

.contact a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="login-box">

<h2>FA Marks Login</h2>

<input
type="text"
id="regNo"
placeholder="Registration Number">

<div class="password-container">

<input
type="password"
id="password"
placeholder="Password">

<span
class="eye"
onclick="togglePassword()">
👁️
</span>

</div>

<button onclick="login()">
Login
</button>

<p id="error"></p>

<div class="contact">

If you need to change your password,<br>

contact at

<a href="mailto:xxxx@gmail.com">
xxxx@gmail.com
</a>

</div>

</div>

<script>

function togglePassword(){

const password=document.getElementById("password");

if(password.type==="password"){

password.type="text";

}else{

password.type="password";

}

}

</script>

<script src="database.js"></script>
<script src="login.js"></script>

</body>
</html>
